# SonarQube Project Configuration
sonar.projectKey=fullstack-blogging-app
sonar.projectName=FullStack-Blogging-App
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage Reports
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Language
sonar.language=java
sonar.java.source=17

# Exclusions (if needed)
sonar.exclusions=**/*Application.java,**/config/**,**/dto/**,**/entity/**,**/model/**
sonar.test.exclusions=**/*Test.java

# Quality Gate Settings
sonar.qualitygate.wait=true

# Additional Analysis Settings
sonar.sourceEncoding=UTF-8
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar

# Code Duplication
sonar.cpd.java.minimumTokens=50

# Issue Detection
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1118
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Application.java